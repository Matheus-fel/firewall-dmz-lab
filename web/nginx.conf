# =====================================================================
# web/nginx.conf  ->  montado em /etc/nginx/conf.d/default.conf
#
# Este arquivo é incluído DENTRO do bloco "http" do nginx, por isso as
# diretivas abaixo (server_tokens, server) já estão no contexto correto.
# =====================================================================

# Esconde a versão do Nginx nas respostas e páginas de erro
# (dificulta a identificação de vulnerabilidades conhecidas).
server_tokens off;

# ---------------------------------------------------------------------
# Servidor HTTP (porta 80) - liberado no firewall pela regra R1
# ---------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança básicos
    add_header X-Frame-Options        "DENY"    always;   # evita clickjacking
    add_header X-Content-Type-Options "nosniff" always;     # evita "adivinhar" tipo de arquivo
    add_header Referrer-Policy        "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Endpoint simples de saúde, usado pelo healthcheck do Docker Compose.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}

# ---------------------------------------------------------------------
# Servidor HTTPS (porta 443) - liberado no firewall pela regra R2
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    # Certificado autoassinado gerado no build da imagem (web/Dockerfile).
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Somente protocolos modernos (TLS 1.0 e 1.1 são considerados inseguros).
    ssl_protocols TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options        "DENY"    always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "no-referrer" always;
    # HSTS: orienta o navegador a usar sempre HTTPS neste domínio.
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
