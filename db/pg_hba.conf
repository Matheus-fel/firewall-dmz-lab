# =====================================================================
# db/pg_hba.conf  ->  montado em /etc/postgresql/pg_hba.conf
#
# "pg_hba" = host-based authentication: define QUEM pode se conectar ao
# PostgreSQL, DE ONDE e COM QUE método de autenticação.
#
# Isto é a "defesa em profundidade": mesmo que o firewall falhasse ou
# fosse contornado, o próprio banco só aceitaria o servidor web.
# As regras são avaliadas de cima para baixo; vale a primeira que casar.
#
# TIPO   BANCO    USUÁRIO    ORIGEM            MÉTODO
# =====================================================================

# Conexões locais (socket Unix, de dentro do container). Usadas pelo
# script de inicialização, pelo healthcheck e por "docker compose exec".
local   all       all                          trust

# ÚNICA conexão de rede permitida: a aplicação (usuário loja_app) ao banco
# lojadb, vinda exclusivamente do IP do servidor web, com senha criptografada.
host    lojadb    loja_app   172.22.0.10/32    scram-sha-256

# Qualquer outra conexão de rede (outro IP, outro usuário, outro banco) é
# rejeitada explicitamente.
host    all       all        0.0.0.0/0         reject
